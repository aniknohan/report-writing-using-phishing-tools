<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>User interaction scoping</title><rect width="960" height="540" rx="14" fill="#0d1117"/><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">User-Interaction Scoping</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Questions answered from internal telemetry  ·  sample case results</text><text x="56" y="114" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">QUESTION</text><text x="476" y="114" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">SOURCE</text><text x="626" y="114" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8b949e">RESULT</text><rect x="36" y="130" width="888" height="62" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="60" cy="161" r="7" fill="#d29922"/><text x="80" y="167" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">Did anyone receive the message?</text><text x="476" y="167" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#58a6ff">Email gateway</text><text x="626" y="167" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#d29922">5 recipients</text><rect x="36" y="202" width="888" height="62" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="60" cy="233" r="7" fill="#3fb950"/><text x="80" y="239" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">Did anyone reply to the sender?</text><text x="476" y="239" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#58a6ff">Email gateway</text><text x="626" y="239" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fb950">No outgoing messages found</text><rect x="36" y="274" width="888" height="62" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="60" cy="305" r="7" fill="#3fb950"/><text x="80" y="311" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">Did any system connect to the domain?</text><text x="476" y="311" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#58a6ff">SIEM</text><text x="626" y="311" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fb950">No connections in reviewed period</text><rect x="36" y="346" width="888" height="62" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="60" cy="377" r="7" fill="#3fb950"/><text x="80" y="383" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">Did any endpoint reach the domain?</text><text x="476" y="383" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#58a6ff">EDR</text><text x="626" y="383" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fb950">No connections identified</text><rect x="36" y="418" width="888" height="62" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="60" cy="449" r="7" fill="#3fb950"/><text x="80" y="455" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">Was a recipient click identified?</text><text x="476" y="455" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#58a6ff">SIEM + EDR</text><text x="626" y="455" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fb950">None identified</text><text x="36" y="498" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">Results reflect the reviewed telemetry at the time of investigation, not proof that no interaction occurred.</text></svg>