<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Sample case overview</title><rect width="960" height="540" rx="14" fill="#0d1117"/><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Sample Case: Credential Phishing</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Outlook-themed account-lock email  ·  sanitized training data</text><rect x="36" y="104" width="432" height="190" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="104" width="5" height="190" rx="2" fill="#d29922"/><text x="58" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#d29922">1 · REPORTED EMAIL</text><text x="58" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Outlook-branded alert</text><text x="58" y="186" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">Your Email Will be Locked! Act NOW!</text><text x="58" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Urgent account-lock threat</text><text x="58" y="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Sent to 5 recipients</text><text x="58" y="252" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Asks users to verify their identity</text><rect x="492" y="104" width="432" height="190" rx="10" fill="#161b22" stroke="#30363d"/><rect x="492" y="104" width="5" height="190" rx="2" fill="#f85149"/><text x="514" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f85149">2 · SENDER INFRASTRUCTURE</text><text x="514" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Brand / infrastructure mismatch</text><text x="514" y="186" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">emailsecalert1@gmail.com</text><text x="514" y="208" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">209.85.222.173</text><text x="514" y="230" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">rDNS: mail-qk1-f173.google.com</text><text x="514" y="252" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Gmail server, not Microsoft</text><rect x="36" y="318" width="432" height="190" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="318" width="5" height="190" rx="2" fill="#bc8cff"/><text x="58" y="346" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#bc8cff">3 · PHISHING PAGE</text><text x="58" y="372" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Fake Outlook login</text><text x="58" y="400" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">hxxps://outlook-security.</text><text x="58" y="422" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">  emailsecalerts[.]net/index/2020/OWA.php</text><text x="58" y="444" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Asks for email address + password</text><text x="58" y="466" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">VirusTotal: malicious / phishing</text><rect x="492" y="318" width="432" height="190" rx="10" fill="#161b22" stroke="#30363d"/><rect x="492" y="318" width="5" height="190" rx="2" fill="#3fb950"/><text x="514" y="346" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#3fb950">4 · VERDICT</text><text x="514" y="372" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Credential Phishing</text><text x="514" y="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Severity: Medium</text><text x="514" y="422" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">No replies (email gateway)</text><text x="514" y="444" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">No connections to domain (SIEM, EDR)</text><text x="514" y="466" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">User interaction: none identified</text><line x1="468" y1="199" x2="488" y2="199" stroke="#8b949e" stroke-width="2"/><polygon points="488,199 479.4,204.2 479.4,193.8" fill="#8b949e"/><line x1="468" y1="413" x2="488" y2="413" stroke="#8b949e" stroke-width="2"/><polygon points="488,413 479.4,418.2 479.4,407.8" fill="#8b949e"/><polyline points="708,294 708,306 252,306 252,312" fill="none" stroke="#8b949e" stroke-width="2"/><line x1="252" y1="306" x2="252" y2="316" stroke="#8b949e" stroke-width="2"/><polygon points="252,316 246.8,307.4 257.2,307.4" fill="#8b949e"/></svg>