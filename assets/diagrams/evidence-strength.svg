<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" width="960" height="454" role="img"><title>Evidence strength model</title><rect width="960" height="454" rx="14" fill="#0d1117"/><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Evidence Strength Model</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">No single signal decides the verdict</text><rect x="36" y="104" width="432" height="210" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="104" width="5" height="210" rx="2" fill="#3fb950"/><text x="58" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#3fb950">STRONG EVIDENCE</text><text x="58" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Behaviour &amp; corroboration</text><text x="58" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Hybrid Analysis behavioural observations</text><text x="58" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">urlscan.io page render + redirect chain</text><text x="58" y="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Talos malicious reputation on a SHA256</text><text x="58" y="252" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Multiple independent VirusTotal detections</text><rect x="492" y="104" width="432" height="210" rx="10" fill="#161b22" stroke="#30363d"/><rect x="492" y="104" width="5" height="210" rx="2" fill="#d29922"/><text x="514" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#d29922">SUPPORTING EVIDENCE</text><text x="514" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Context &amp; intelligence</text><text x="514" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">PhishTank listing</text><text x="514" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">URLhaus listing</text><text x="514" y="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Recently registered domain</text><text x="514" y="252" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Remote screenshot</text><text x="514" y="274" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">CyberChef-decoded destination</text><rect x="36" y="338" width="888" height="80" rx="10" fill="#161b22" stroke="#58a6ff"/><text x="480" y="372" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Verdict = correlation of multiple independent signals</text><text x="480" y="398" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">A clean result never proves an artifact is safe  ·  domain age alone never proves it is malicious</text><line x1="252" y1="314" x2="252" y2="334" stroke="#3fb950" stroke-width="2"/><polygon points="252,334 246.8,325.4 257.2,325.4" fill="#3fb950"/><line x1="708" y1="314" x2="708" y2="334" stroke="#d29922" stroke-width="2"/><polygon points="708,334 702.8,325.4 713.2,325.4" fill="#d29922"/></svg>