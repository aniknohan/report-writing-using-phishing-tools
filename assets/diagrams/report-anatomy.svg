<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Report template anatomy</title><rect width="960" height="540" rx="14" fill="#0d1117"/><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Report Template Anatomy</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">17 sections, from executive summary to conclusion</text><rect x="36" y="104" width="288" height="404" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="104" width="288" height="5" rx="2" fill="#58a6ff"/><text x="56" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#58a6ff">SUMMARY &amp; ARTIFACTS</text><rect x="52" y="154" width="256" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><text x="66" y="176" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#58a6ff">1</text><text x="98" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Executive Summary</text><rect x="52" y="200" width="256" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><text x="66" y="222" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#58a6ff">2</text><text x="98" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Email Artifacts</text><rect x="52" y="246" width="256" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><text x="66" y="268" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#58a6ff">3</text><text x="98" y="268" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Web Artifacts</text><text x="56" y="330" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">A strong report answers:<